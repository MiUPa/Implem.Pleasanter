<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 221 235">
  <!-- Kumitate logo mark: four rounded blocks in a 2x2 grid.
       The top-right block is sheared (skewY -10deg) and shifted slightly
       up/right, as if sliding into place. Teal sampled from the approved
       candidate artwork (#00AA84). -->
  <g fill="#00AA84">
    <rect x="3" y="23" width="100" height="100" rx="15"/>
    <g transform="translate(118 20) skewY(-10)">
      <rect x="0" y="0" width="100" height="100" rx="15"/>
    </g>
    <rect x="3" y="132" width="100" height="100" rx="15"/>
    <rect x="112" y="132" width="100" height="100" rx="15"/>
  </g>
</svg>
